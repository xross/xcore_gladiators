# Edit this file only to change models, tasks, skill conditions, limits or pricing.
# Verify exact model IDs with: opencode models

[experiment]
name = "Gladiators - XMOS coding-agent benchmark"
seed = 20261106
repeats = 1                 # increase to >= 3 for meaningful comparisons
smoke_models = ["luna", "sol"]  # --smoke: two workers x two warm implementation conditions, plus referee
parallel_sim_runs = 1       # 1 preferred for fair wall-time and CPU comparisons
worker_timeout_seconds = 2700
reviewer_timeout_seconds = 1200
verifier_timeout_seconds = 900
progress_interval_seconds = 20  # console heartbeat during long OpenCode/verifier/review stages; 0 disables
# Native skill location is REQUIRED on the CLI: --skills-dir /path/to/xskills/skills
# XTC warm control also requires --xtc-env /path/to/XMOS_XTC_15.3.1/SetEnv.sh
# (macOS/Linux). Start the script from an ordinary shell with XTC NOT activated.
# Do not put it in this TOML file.
# Optional separate HOME with Copilot auth but NO global skills/AGENTS.md.
# See README instructions before using this on a real machine.
clean_home = ""
opencode_command = "opencode"
review_enabled = true
pricing_checked = "2026-11-06"
pricing_source = "https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing"

[models]
# Both worker and reviewer models are changeable. Reviewer MUST NOT equal a worker.
reviewer = "github-copilot/gpt-6-astra"

[models.workers]
sol = "github-copilot/gpt-6.1-sol"
opus = "github-copilot/claude-opus-5.5"
luna = "github-copilot/gpt-6-luna"

# Report-only model catalogue. These descriptions are recorded BEFORE testing:
# they are provider-published categories / intended uses, not measured quality.
# Update these entries if you change a model ID, and record the source/date.
# Model parameter counts are not disclosed by their developers; do not infer
# parameter count from Copilot's Powerful/Lightweight categories or token prices.
[model_profiles."github-copilot/gpt-6.1-sol"]
display_name = "GPT-6.1 Sol"
developer = "OpenAI"
published_category = "Powerful"
parameter_count = "Not publicly disclosed"
context_window = "Not verified for OpenCode via GitHub Copilot"
quality_expectation = "High-capability implementer; designed for complex coding and advanced reasoning. This is an intended-use expectation, not an experimental score."
selection_rationale = "Representative high-capability OpenAI worker for complex embedded-development tasks."
source = "https://docs.github.com/en/copilot/reference/ai-models/model-comparison"
source_checked = "2026-11-06"

[model_profiles."github-copilot/claude-opus-5.5"]
display_name = "Claude Opus 5.5"
developer = "Anthropic"
published_category = "Powerful"
parameter_count = "Not publicly disclosed"
context_window = "Not verified for OpenCode via GitHub Copilot"
quality_expectation = "High-capability agentic coding worker; intended for complex, multistep tasks, error recovery and collaboration. Not a measured quality rating."
selection_rationale = "Cross-vendor high-capability comparison against the OpenAI implementer."
source = "https://docs.github.com/en/copilot/reference/ai-models/model-comparison"
source_checked = "2026-11-06"

[model_profiles."github-copilot/gpt-6-luna"]
display_name = "GPT-6 Luna"
developer = "OpenAI"
published_category = "Lightweight"
parameter_count = "Not publicly disclosed"
context_window = "Not verified for OpenCode via GitHub Copilot"
quality_expectation = "Fast, low-cost baseline suited to simpler tasks; benchmark tests whether specialist skills close any capability gap. Not assumed to fail."
selection_rationale = "Lightweight and low-cost implementer to test whether skills disproportionately help smaller-cost-tier models."
source = "https://docs.github.com/en/copilot/reference/ai-models/model-comparison"
source_checked = "2026-11-06"

[model_profiles."github-copilot/gpt-6-astra"]
display_name = "GPT-6 Astra"
developer = "OpenAI"
published_category = "Powerful"
parameter_count = "Not publicly disclosed"
context_window = "Not verified for OpenCode via GitHub Copilot"
quality_expectation = "High-capability long-horizon autonomous coding/verification model, selected for blind review; not an objective guarantee of judging quality."
selection_rationale = "Independent, high-capability reviewer using a different exact model ID from all implementers."
source = "https://docs.github.com/en/copilot/reference/ai-models/model-comparison"
source_checked = "2026-11-06"

# Primary implementation comparison: both workers start with XTC ready.
[conditions.native_xtc]
type = "native"

# Toolchain preconfigured but NO local/native skills: separates installation
# obstacles from model design quality. Requires --xtc-env SCRIPT on the CLI.
[conditions.no_skills_xtc]
type = "none"

# Enable this later when evaluating the actual XMOS MCP server.
# [conditions.mcp]
# type = "mcp"
# url = "https://mcp.xmos.com/mcp"
# server_name = "xcore-skills"

# GitHub Copilot default-context rates (USD per 1M tokens), verified 2026-11-06.
# Source: https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Rates may change; extended-context tiers cost more. Update before each experiment.
[pricing."github-copilot/gpt-6.1-sol"]
input = 2.0
cache_read = 0.10
cache_write = 2.5
output = 10.0

[pricing."github-copilot/claude-opus-5.5"]
input = 4.0
cache_read = 0.20
cache_write = 5.0
output = 20.0

[pricing."github-copilot/gpt-6-luna"]
input = 0.10
cache_read = 0.01
cache_write = 0.125
output = 0.5

[pricing."github-copilot/gpt-6-astra"]
input = 10.0
cache_read = 1.0
cache_write = 12.5
output = 50.0

# Every task must name a supported independent verifier. No unverified runs.

[[tasks]]
id = "uart-heartbeat-specific"
revision = "implementation-v2"
evaluation_class = "implementation"
verifier = "uart-heartbeat-implementation-v2"
conditions = ["no_skills_xtc", "native_xtc"]
family = "uart-heartbeat"
specificity = "specific"
kind = "sim"
rationale = "Specified UART framing, waveform and concurrency requirements; tests hardware timing choices and correctness without prescribing XMOS implementation details."
prompt = "tasks/uart-heartbeat/prompt-implementation-v2.md"
starter = "tasks/uart-heartbeat/starter"
